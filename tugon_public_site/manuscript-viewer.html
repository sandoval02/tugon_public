<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUGON Final Manuscript · Protected Academic Preview</title>
  <meta name="description"
    content="Protected academic read-only preview of the TUGON Undergraduate Thesis Manuscript (LSPU CCS).">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }

    .viewer-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      backdrop-filter: blur(1.25rem);
      -webkit-backdrop-filter: blur(1.25rem);
      border-bottom: 1px solid var(--line);
      padding: 0.625rem 1rem;
    }

    .viewer-nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .viewer-title-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .viewer-title {
      font-family: var(--font-display);
      font-size: 0.9375rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
    }

    .viewer-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .watermark-banner {
      background: color-mix(in srgb, var(--accent) 15%, var(--bg-2));
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-align: center;
      padding: 0.35rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .viewer-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0.75rem 1rem 1.5rem;
      background: var(--bg);
      position: relative;
    }

    .frame-container {
      width: 100%;
      max-width: 1200px;
      height: calc(100vh - 7.5rem);
      min-height: 650px;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 768px) {
      .viewer-title {
        font-size: 0.8125rem;
      }
      .frame-container {
        height: calc(100vh - 8.5rem);
        min-height: 500px;
        border-radius: 8px;
      }
      .viewer-main {
        padding: 0.5rem 0.5rem 1rem;
      }
    }
  </style>
</head>

<body oncontextmenu="return false;">

  <!-- Security Banner -->
  <div class="watermark-banner">
    <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
    </svg>
    <span><strong>PROTECTED PREVIEW:</strong> Read-Only Academic Copy · Direct Downloads &amp; Printing Restricted</span>
  </div>

  <!-- Navigation Toolbar -->
  <header class="viewer-navbar">
    <div class="viewer-nav-inner">
      <div class="viewer-title-group">
        <a href="index.html" class="btn btn-outline btn-sm" title="Back to Project Overview">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Overview
        </a>
        <div class="viewer-title">TUGON Research Manuscript</div>
        <span class="tag tag-accent" style="font-size: 0.6875rem;">View-Only (479 Pages)</span>
      </div>

      <div class="viewer-controls">
        <a href="https://drive.google.com/file/d/1fJMk-bnOyyRQQZj4xumOkgQ1ThTPKd5a/view?usp=sharing" target="_blank"
          rel="noopener noreferrer" class="btn btn-outline btn-sm" title="Open full view in Google Drive">
          <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z" />
          </svg>
          Open in Google Drive
        </a>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="icon-btn" title="Toggle color theme" aria-label="Toggle color theme">
          <span id="theme-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Document Viewer Main Area -->
  <main class="viewer-main">
    <div class="frame-container">
      <iframe
        id="drive-frame"
        class="viewer-frame"
        src="https://drive.google.com/file/d/1fJMk-bnOyyRQQZj4xumOkgQ1ThTPKd5a/preview"
        allow="autoplay"
        title="TUGON Manuscript Protected Preview">
      </iframe>
    </div>
  </main>

  <script>
    // Theme Toggle Support
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    const themeIconEl = document.getElementById('theme-icon');

    function syncThemeIcon(theme) {
      if (!themeIconEl) return;
      if (theme === 'dark') {
        themeIconEl.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
      } else {
        themeIconEl.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
      }
    }

    const currentTheme = localStorage.getItem('tugon-theme') || 'dark';
    htmlEl.setAttribute('data-theme', currentTheme);
    syncThemeIcon(currentTheme);

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const now = htmlEl.getAttribute('data-theme') || 'dark';
        const next = now === 'dark' ? 'light' : 'dark';
        htmlEl.setAttribute('data-theme', next);
        localStorage.setItem('tugon-theme', next);
        syncThemeIcon(next);
      });
    }

    // Block Common Shortcuts
    window.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        alert('Saving is restricted for this read-only review copy.');
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')) {
        e.preventDefault();
        alert('Printing is restricted for this read-only review copy.');
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
      }
    });

    window.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      return false;
    });
  </script>
</body>

</html>
